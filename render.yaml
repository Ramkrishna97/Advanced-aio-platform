services:
  - type: web
    name: all-ms-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_ADDRESS
        value: "0.0.0.0"
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: MEDIA_RESOURCE_LIMITS
        value: "true"
      - key: MEDIA_MAX_STORED_IMAGE_BYTES
        value: "50000"
      - key: MEDIA_MAX_VIDEO_BYTES
        value: "2000000"
      - key: MEDIA_MAX_OTHER_FILE_BYTES
        value: "2000000"
      - key: MEDIA_STORAGE_LIMIT_BYTES
        value: "200000000"
      - key: MAX_MULTIPART_FILE_SIZE
        value: "10MB"
      - key: MAX_MULTIPART_REQUEST_SIZE
        value: "11MB"
