services:
  - type: web
    name: all-ms-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_ADDRESS
        value: "0.0.0.0"
      - key: AUTH_JWT_SECRET
        value: "local-demo-secret-change-before-deployment-2026"
