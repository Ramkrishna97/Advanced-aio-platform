# Netlify Configuration File (UI/play)

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  NETLIFY_SKIP_SUBMODULES = "true"
  GIT_SUBMODULES = "false"
  REACT_APP_MAX_VIDEO_BYTES = "2000000"

# Keep frontend API calls same-origin and proxy them to Render.
[[redirects]]
  from = "/api/*"
  to = "https://all-ms-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) redirect rule for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
