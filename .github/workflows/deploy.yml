name: CI/CD Pipeline - Build and Test Full Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    name: Build Backend Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Spring Boot Microservices
        run: |
          cd Backend
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

  build-frontend:
    name: Build Frontend UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'UI/play/package-lock.json'

      - name: Install and Build Frontend
        run: |
          cd UI/play
          npm ci
          npm run build
