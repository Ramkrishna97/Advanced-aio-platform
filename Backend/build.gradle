plugins {
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.example.dashboard'
    version = '0.1.0'

    repositories { mavenCentral() }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(17) }
    }

    dependencyManagement {
        imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.0' }
    }
}

subprojects {
    dependencies {
        if (project.name != 'discovery-service') {
            implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
            implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
        }
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    }

    tasks.named('bootRun') {
        workingDir = rootProject.projectDir
    }
}

project(':media-common') {
    tasks.named('bootJar') { enabled = false }
    tasks.named('jar') { enabled = true }
}

dependencies {
    implementation project(':auth-service')
    implementation project(':catalog-service')
    implementation project(':cart-service')
    implementation project(':classroom-service')
    implementation project(':feed-service')
    implementation project(':studio-editor-service')
    implementation project(':quiz-service')
    implementation project(':order-delivery-service')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') { useJUnitPlatform() }

// The Render image runs every controller in one JVM. Discovery, Feign and the
// Swagger UI are useful for standalone services but unnecessary deployment
// weight in this unified artifact.
configurations.configureEach {
    exclude group: 'org.springframework.cloud', module: 'spring-cloud-starter-netflix-eureka-client'
    exclude group: 'org.springframework.cloud', module: 'spring-cloud-starter-openfeign'
    exclude group: 'org.springdoc', module: 'springdoc-openapi-starter-webmvc-ui'
}
