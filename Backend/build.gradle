plugins {
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.example.dashboard'
    version = '0.1.0'

    repositories { mavenCentral() }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(17) }
    }

    dependencyManagement {
        imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.0' }
    }
}

subprojects {
    dependencies {
        if (project.name != 'discovery-service') {
            implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
            implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
        }
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    }

    tasks.named('bootRun') {
        workingDir = rootProject.projectDir
    }
}

dependencies {
    implementation project(':auth-service')
    implementation project(':catalog-service')
    implementation project(':cart-service')
    implementation project(':classroom-service')
    implementation project(':feed-service')
    implementation project(':studio-editor-service')
    implementation project(':quiz-service')
    implementation project(':order-delivery-service')
    implementation project(':gateway')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}
