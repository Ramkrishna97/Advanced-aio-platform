spring.application.name=feed-service
server.port=8085
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:h2:file:../resources/database/feed;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${AUTH_JWT_SECRET:local-demo-secret-change-before-deployment-2026}
services.classroom=${CLASSROOM_SERVICE_URL:http://localhost:8084}
services.auth=${AUTH_SERVICE_URL:http://localhost:8081}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
management.endpoints.web.exposure.include=health,info
app.media-dir=${FEED_MEDIA_DIR:../resources/feed}
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
