spring.application.name=cart-service
server.port=8083
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:h2:file:../resources/database/cart;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
app.jwt.secret=${AUTH_JWT_SECRET:local-demo-secret-change-before-deployment-2026}
app.service.key=${SERVICE_KEY:local-demo-service-key-change-before-deployment}
app.snapshot-dir=${SNAPSHOT_DIR:../resources/data}
services.catalog=${CATALOG_SERVICE_URL:http://localhost:8082}
services.delivery=${ORDER_DELIVERY_SERVICE_URL:http://localhost:8088}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
springdoc.swagger-ui.path=/swagger-ui.html
