spring.application.name=ms-services
spring.servlet.multipart.max-file-size=${MAX_MULTIPART_FILE_SIZE:2048MB}
spring.servlet.multipart.max-request-size=${MAX_MULTIPART_REQUEST_SIZE:2049MB}
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=jdbc:h2:file:${STORAGE_ROOT:../resources}/database/all-services;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
app.jwt.secret=${AUTH_JWT_SECRET:local-demo-secret-change-before-deployment-2026}
app.service.key=${SERVICE_KEY:local-internal-service-key}
app.snapshot-dir=${SNAPSHOT_DIR:${STORAGE_ROOT:../resources}/data}
app.user-resource-dir=${USER_RESOURCE_DIR:${STORAGE_ROOT:../resources}/users}
app.product-resource-dir=${PRODUCT_RESOURCE_DIR:${STORAGE_ROOT:../resources}/products}
app.resource-dir=${CLASSROOM_RESOURCE_DIR:${STORAGE_ROOT:../resources}/classroom}
app.quiz-dir=${QUIZ_DIR:${STORAGE_ROOT:../resources}/classroom/quizzes}
app.video-dir=${VIDEO_DIR:${STORAGE_ROOT:../resources}/classroom/videos}
app.media-dir=${FEED_MEDIA_DIR:${STORAGE_ROOT:../resources}/feed}
services.auth=${BASE_SERVICE_URL:http://localhost:${server.port}}
services.catalog=${BASE_SERVICE_URL:http://localhost:${server.port}}
services.cart=${BASE_SERVICE_URL:http://localhost:${server.port}}
services.classroom=${BASE_SERVICE_URL:http://localhost:${server.port}}
services.feed=${BASE_SERVICE_URL:http://localhost:${server.port}}
services.studio=${BASE_SERVICE_URL:http://localhost:${server.port}}
services.quiz=${BASE_SERVICE_URL:http://localhost:${server.port}}
services.delivery=${BASE_SERVICE_URL:http://localhost:${server.port}}
