spring.application.name=classroom-service
server.port=8084
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:h2:file:../resources/database/classroom;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
app.jwt.secret=${AUTH_JWT_SECRET:local-demo-secret-change-before-deployment-2026}
services.auth=${AUTH_SERVICE_URL:http://localhost:8081}
app.resource-dir=${RESOURCE_DIR:../resources/classroom}
app.quiz-dir=${QUIZ_DIR:../resources/classroom/quizzes}
app.video-dir=${VIDEO_DIR:../resources/classroom/videos}
app.snapshot-dir=${SNAPSHOT_DIR:../resources/data}
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
springdoc.swagger-ui.path=/swagger-ui.html
