plugins { id 'org.springframework.boot' version '3.5.6'; id 'io.spring.dependency-management' version '1.1.7' }
group='com.example.dashboard'; version='0.1.0'; java { toolchain { languageVersion=JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }
dependencyManagement { imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.0' } }
dependencies { implementation 'org.springframework.boot:spring-boot-starter-web'; implementation 'org.springframework.boot:spring-boot-starter-actuator'; implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server' }
