spring.application.name=order-delivery-service
server.port=8088
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=jdbc:h2:file:../resources/database/delivery;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${AUTH_JWT_SECRET:local-demo-secret-change-before-deployment-2026}
app.service.key=${SERVICE_KEY:local-demo-service-key-change-before-deployment}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-delivery-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.properties.max.block.ms=1000
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
