# Netlify Configuration File (Root)

[build]
  # Base directory for the React application
  base = "UI/play"

  # Command to build the application
  command = "npm run build"

  # Folder where the build output is located (relative to base)
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"

# Single Page Application (SPA) redirect rule for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
